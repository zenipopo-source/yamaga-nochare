<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脳ちゃれ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Yu Gothic',sans-serif;background:#fffaf1;color:#2d3a3a;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border:2px solid #d9e6df;border-radius:24px;padding:28px;text-align:center}h1{font-size:44px}.btn{width:100%;padding:20px;border:0;border-radius:18px;background:#5f9d7b;color:#fff;font-size:30px;font-weight:800;margin:14px 0}.item{display:inline-flex;width:42%;min-height:120px;margin:2%;border:3px solid #d9e6df;border-radius:18px;align-items:center;justify-content:center;flex-direction:column;font-size:56px;background:#fff}.item span{font-size:20px}.sel{border-color:#5f9d7b;background:#eef7f2}.hide{display:none}.note{background:#eef7f2;border-radius:16px;padding:15px;font-size:22px;line-height:1.6}.small{font-size:17px;color:#667}</style></head><body><div class="wrap"><div class="card" id="app"></div></div><script>const sets=[{m:[['🍎','りんご'],['🐶','いぬ'],['🚲','じてんしゃ']],d:[['🚌','バス'],['🍞','パン'],['🌂','かさ']]},{m:[['🍌','バナナ'],['🐱','ねこ'],['🚗','くるま']],d:[['🍎','りんご'],['🐟','さかな'],['🚌','バス']]},{m:[['🍊','みかん'],['🐰','うさぎ'],['🚌','バス']],d:[['🍌','バナナ'],['🐶','いぬ'],['🚲','じてんしゃ']]}];let ci=+(localStorage.nc||0)%sets.length;localStorage.nc=(ci+1)%sets.length;let S=sets[ci],sel=[];function page(n){let a=document.getElementById('app');if(n==0)a.innerHTML='<div style="font-size:80px">🧠🌱</div><h1>脳ちゃれ</h1><p class="note">ゲーム感覚で、脳のいろいろな働きを使ってみましょう。</p><button class="btn" onclick="page(1)">はじめる</button><p class="small">※これは認知症を診断する検査ではありません。</p>';if(n==1)a.innerHTML='<h1>おぼえてね！</h1><p class="note">この3つを覚えてください。あとでもう一度聞きます。</p>'+S.m.map(x=>'<div class="item">'+x[0]+'<span>'+x[1]+'</span></div>').join('')+'<button class="btn" onclick="page(2)">覚えました</button>';if(n==2){let q=[...S.m.map(x=>[...x,1]),...S.d.map(x=>[...x,0])].sort(()=>Math.random()-.5);a.innerHTML='<h1>何を覚えていた？</h1><p class="note">最初に出てきた3つを選んでください。</p>'+q.map((x,i)=>'<button class="item" data-ok="'+x[2]+'" onclick="this.classList.toggle(\'sel\')">'+x[0]+'<span>'+x[1]+'</span></button>').join('')+'<button class="btn" onclick="page(3)">決定</button>'}if(n==3)a.innerHTML='<div style="font-size:80px">🌸🧠✨</div><h1>おつかれさまでした！</h1><p class="note"><b>最近、もの忘れが気になりますか？</b><br>少しでも気になったら、相談のタイミングです。早めの相談が、これからの安心につながります。</p><button class="btn" onclick="location.reload()">もう一度</button><p class="small">必要に応じてスタッフがMini-Cogなどで確認します。</p>'}page(0)</script></body></html>
